packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - esbuild
  - workerd
  - "@cloudflare/workerd-darwin-arm64"
  - "@cloudflare/workerd-darwin-64"

# Explicitly NOT built (a transitive optional dep of @cloudflare/puppeteer we don't use;
# its native build needs cairo/pango which aren't on CI runners). Listing it here resolves
# the pnpm 11 ERR_PNPM_IGNORED_BUILDS error without attempting the (failing) build.
ignoredBuiltDependencies:
  - canvas
